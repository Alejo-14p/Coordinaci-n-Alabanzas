<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Coordinación · Alabanza</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#042224">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Alabanza">
<style>
  :root{
    --bg: #042224;
    --surface: #0C3934;
    --surface-2: #123F3A;
    --accent: #98F755;
    --accent-soft: rgba(152,247,85,0.32);
    --sage: #7CA890;
    --amber: #E0A94B;
    --rose: #C97C7C;
    --text: #F5EFE0;
    --text-muted: #B8AFC4;
    --line: rgba(245,239,224,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  .staff{height:14px;margin-bottom:18px;position:relative;}
  .staff::before, .staff::after, .staff .mid{
    content:"";position:absolute;left:0;right:0;height:1px;background:var(--accent-soft);
  }
  .staff::before{top:0;}
  .staff::after{bottom:0;}
  .staff .mid{top:50%;}
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    letter-spacing:-0.01em;
    margin:0 0 2px;
  }
  header .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:6px;
  }
  header .sub{color:var(--text-muted);font-size:14px;margin-bottom:22px;}
  .who{
    display:flex;align-items:center;justify-content:space-between;
    font-size:13px;color:var(--text-muted);
    margin-bottom:22px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .who button{
    background:none;border:none;color:var(--accent);font-size:12px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;text-decoration:underline;padding:0;
  }

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:24px;background:var(--surface);padding:4px;border-radius:10px;}
  .tab{
    flex:1;text-align:center;padding:10px 8px;border-radius:8px;cursor:pointer;
    font-size:13px;font-weight:500;color:var(--text-muted);transition:all .15s;
    user-select:none;
  }
  .tab.active{background:var(--accent);color:#042224;font-weight:600;}

  /* Service card */
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 20px;
    margin-bottom:16px;
  }
  .card .date-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .card .date{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);letter-spacing:0.04em;}
  .card .label{font-family:'Fraunces',serif;font-size:19px;font-weight:600;margin:2px 0 12px;}
  .divider{height:1px;background:var(--line);margin:12px 0;}

  .role-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;
    font-size:14px;
  }
  .role-row .role-info{display:flex;flex-direction:column;gap:2px;}
  .role-name{font-weight:500;}
  .role-person{color:var(--text-muted);font-size:12.5px;}
  .badge{
    font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;
    font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;
  }
  .badge.confirmed{background:rgba(124,168,144,0.20);color:var(--sage);}
  .badge.declined{background:rgba(201,124,124,0.18);color:var(--rose);}
  .badge.pending{background:rgba(224,169,75,0.18);color:var(--amber);}

  .confirm-actions{display:flex;gap:8px;}
  .btn-small{
    border:1px solid var(--line);background:var(--surface-2);color:var(--text);
    padding:6px 12px;border-radius:8px;font-size:12.5px;cursor:pointer;font-weight:500;
  }
  .btn-small.yes:hover{border-color:var(--sage);color:var(--sage);}
  .btn-small.no:hover{border-color:var(--rose);color:var(--rose);}

  .empty{
    text-align:center;color:var(--text-muted);font-size:14px;padding:50px 20px;
  }
  .empty .big{font-family:'Fraunces',serif;font-size:20px;color:var(--text);margin-bottom:6px;}

  /* Forms */
  .btn-main{
    background:var(--accent);color:#042224;border:none;border-radius:10px;
    padding:12px 18px;font-weight:600;font-size:14px;cursor:pointer;width:100%;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .btn-main:hover{filter:brightness(1.08);}
  .btn-ghost{
    background:none;border:1px dashed var(--line);color:var(--text-muted);
    border-radius:10px;padding:12px;width:100%;cursor:pointer;font-size:14px;margin-top:6px;
  }
  input, select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:11px 12px;border-radius:9px;font-size:14px;margin-bottom:10px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  input::placeholder{color:var(--text-muted);}
  label.field-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);margin-bottom:6px;display:block;font-family:'IBM Plex Mono',monospace;}
  .role-form-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .role-form-row input{margin-bottom:0;}
  .remove-role{background:none;border:none;color:var(--rose);cursor:pointer;font-size:18px;padding:0 4px;}
  .role-list-mini{margin:10px 0;}
  .role-chip{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--surface-2);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:13px;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.55);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:26px;max-width:380px;width:100%;
  }
  .modal h2{font-family:'Fraunces',serif;font-size:22px;margin:0 0 6px;}
  .modal p{color:var(--text-muted);font-size:13.5px;margin:0 0 18px;}

  .section-title{
    font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;
    letter-spacing:0.1em;color:var(--text-muted);margin:26px 0 12px;
  }
  .card-header-row{display:flex;justify-content:space-between;align-items:center;}
  .icon-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;}
  .icon-btn:hover{color:var(--rose);}

  .song-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;}
  .song-num{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);width:16px;flex-shrink:0;}
  .song-title{flex:1;font-weight:500;}
  .song-key{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-muted);background:var(--surface-2);padding:3px 9px;border-radius:6px;}
  .remove-song{background:none;border:none;color:var(--rose);cursor:pointer;font-size:15px;padding:0 2px;flex-shrink:0;}
  .add-song-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .add-song-row input{margin-bottom:0;}
  .add-song-row .song-key-input{max-width:90px;}
  .link-btn{
    background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;
    font-family:'IBM Plex Sans',sans-serif;padding:6px 0;font-weight:500;
  }
  .mini-note{color:var(--text-muted);font-size:12.5px;margin-top:6px;}
  .song-artist{color:var(--text-muted);font-weight:400;font-size:12.5px;}
  .song-link{
    font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--accent);
    background:rgba(152,247,85,0.14);padding:3px 9px;border-radius:6px;
    text-decoration:none;flex-shrink:0;
  }
  .song-link:hover{background:rgba(152,247,85,0.25);}

  .song-search-wrap{position:relative;flex:1;}
  .song-dropdown{
    position:absolute;top:100%;left:0;right:0;background:var(--surface-2);
    border:1px solid var(--line);border-radius:10px;margin-top:4px;
    max-height:220px;overflow-y:auto;z-index:20;
    box-shadow:0 8px 20px rgba(0,0,0,0.35);
  }
  .song-suggestion{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;}
  .song-suggestion:hover{background:rgba(152,247,85,0.14);}
  .song-suggestion img{width:32px;height:32px;border-radius:4px;flex-shrink:0;object-fit:cover;}
  .song-suggestion .sinfo{display:flex;flex-direction:column;gap:1px;overflow:hidden;}
  .song-suggestion .stitle{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .song-suggestion .sartist{font-size:11.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .song-loading{padding:8px 10px;font-size:12.5px;color:var(--text-muted);}

  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
  }
  .cal-weekday{text-align:center;font-size:11px;color:var(--text-muted);font-family:'IBM Plex Mono',monospace;padding-bottom:6px;}
  .cal-cell{
    position:relative;height:40px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);
  }
  .cal-cell.empty{cursor:default;}
  .cal-cell:hover:not(.empty){background:var(--surface-2);}
  .cal-cell.today{box-shadow:inset 0 0 0 1px var(--accent-soft);}
  .cal-cell.selected{background:var(--accent);color:var(--bg);font-weight:600;}
  .cal-dot{
    position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
    width:5px;height:5px;border-radius:50%;background:var(--accent);
  }
  .cal-cell.selected .cal-dot{background:var(--bg);}

  @media (max-width: 560px){
    .wrap{ padding:20px 14px 70px; }
    header h1{ font-size:24px; }

    input, select{
      font-size:16px;
    }

    .who{
      flex-direction:column;
      align-items:flex-start;
      gap:10px;
    }
    .who > span:first-child{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .who > span:last-child{ width:100%; }

    .tabs{
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
      justify-content:flex-start;
    }
    .tab{
      flex:0 0 auto;
      white-space:nowrap;
      padding:10px 14px;
    }

    .role-form-row{
      flex-wrap:wrap;
      row-gap:8px;
    }
    .role-form-row input,
    .role-form-row select{
      flex:1 1 100%;
      min-width:0;
    }
    .role-form-row .remove-role{
      flex:0 0 auto;
      margin-left:auto;
    }

    .add-song-row{
      flex-wrap:wrap;
      row-gap:8px;
    }
    .add-song-row .song-search-wrap{
      flex:1 1 100%;
    }
    .add-song-row .song-key-input{
      flex:1 1 100%;
      max-width:none;
    }

    .song-row{
      flex-wrap:wrap;
      row-gap:6px;
    }
    .song-row .song-title{
      flex:1 1 100%;
      order:1;
    }
    .song-row .song-num{ order:0; }
    .song-row .song-key,
    .song-row .song-link{ order:2; }
    .song-row .remove-song{
      order:3;
      margin-left:auto;
    }

    .confirm-actions{
      flex-wrap:wrap;
    }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCGdyD-x257YV9hXxH8-WgiAm-7yBUE_Ww",
  authDomain: "coordinacion-de-servicio-fde40.firebaseapp.com",
  projectId: "coordinacion-de-servicio-fde40",
  storageBucket: "coordinacion-de-servicio-fde40.firebasestorage.app",
  messagingSenderId: "564912686128",
  appId: "1:564912686128:web:d810e6dd51e80cf97599f5"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const NAME_STORAGE_KEY = 'coordinacion-alabanza-my-name';

const STORAGE_SERVICES_KEY = 'services';
let myName = null;
let services = [];
let activeTab = 'mias';
let calendarViewDate = new Date();
let selectedCalendarDay = null;
let showAddForm = false;
let draftDate = '';
let draftLabel = '';
let draftTime = '';
let editingServiceId = null;
let editDraftDate = '';
let editDraftLabel = '';
let editDraftTime = '';
let editDraftRoles = [];
let draftRoles = [];
let draftSongs = [];
let songFormOpenFor = null;
let lastResults = {};
let searchTimers = {};
let youtubeApiKey = null;
let showApiKeyModal = false;
let rolesMap = {};
let songLibrary = [];
let songSuggestions = [];

function loadAll(){
  try{
    myName = localStorage.getItem(NAME_STORAGE_KEY);
  }catch(e){ myName = null; }

  db.collection('shared').doc('services').onSnapshot(doc=>{
    services = doc.exists ? (doc.data().value || []) : [];
    render();
  }, e=>console.error('Error sincronizando servicios:', e));

  db.collection('shared').doc('youtube-api-key').onSnapshot(doc=>{
    youtubeApiKey = doc.exists ? (doc.data().value || null) : null;
    render();
  }, e=>console.error('Error sincronizando la clave de YouTube:', e));

  db.collection('shared').doc('user-roles').onSnapshot(doc=>{
    if(doc.exists){
      rolesMap = doc.data().value || {};
      render();
    }else{
      rolesMap = { 'diego escobar':'coordinator', 'alejandro pérez':'developer' };
      saveRoles();
    }
  }, e=>console.error('Error sincronizando accesos:', e));

  db.collection('shared').doc('song-library').onSnapshot(doc=>{
    songLibrary = doc.exists ? (doc.data().value || []) : [];
    render();
  }, e=>console.error('Error sincronizando el repertorio guardado:', e));

  db.collection('shared').doc('song-suggestions').onSnapshot(doc=>{
    songSuggestions = doc.exists ? (doc.data().value || []) : [];
    render();
  }, e=>console.error('Error sincronizando las sugerencias:', e));

  render();
}

async function saveSongSuggestions(){
  try{
    await db.collection('shared').doc('song-suggestions').set({ value: songSuggestions });
  }catch(e){
    console.error('No se pudo guardar las sugerencias:', e);
  }
}

async function submitSuggestion(){
  const rowId = 'suggestnew';
  const titleEl = document.getElementById('song-title-'+rowId);
  const artistEl = document.getElementById('song-artist-'+rowId);
  const keyEl = document.getElementById('song-key-'+rowId);
  const linkEl = document.getElementById('song-link-'+rowId);
  const title = titleEl.value.trim();
  if(!title){ titleEl.focus(); return; }
  songSuggestions.push({
    id: uid(),
    title,
    artist: (artistEl?.value || '').trim(),
    key: (keyEl?.value || '').trim(),
    link: safeYouTubeUrl(linkEl?.value),
    suggestedBy: myName
  });
  await saveSongSuggestions();
  titleEl.value = '';
  if(artistEl) artistEl.value = '';
  if(keyEl) keyEl.value = '';
  if(linkEl) linkEl.value = '';
  render();
}

async function approveSuggestion(id){
  const sug = songSuggestions.find(s=>s.id===id);
  if(!sug) return;
  await addToLibraryIfNew({ title: sug.title, artist: sug.artist, key: sug.key, link: sug.link });
  songSuggestions = songSuggestions.filter(s=>s.id!==id);
  await saveSongSuggestions();
  render();
}

async function rejectSuggestion(id){
  songSuggestions = songSuggestions.filter(s=>s.id!==id);
  await saveSongSuggestions();
  render();
}

async function saveSongLibrary(){
  try{
    await db.collection('shared').doc('song-library').set({ value: songLibrary });
  }catch(e){
    console.error('No se pudo guardar el repertorio:', e);
  }
}

function songsMatch(a, b){
  if(a.link && b.link && a.link === b.link) return true;
  return (a.title||'').trim().toLowerCase() === (b.title||'').trim().toLowerCase();
}

async function addToLibraryIfNew(song){
  if(!song.title) return;
  const exists = songLibrary.some(sg=>songsMatch(sg, song));
  if(exists) return;
  songLibrary.push({
    id: uid(),
    title: song.title,
    artist: song.artist || '',
    key: song.key || '',
    link: song.link || ''
  });
  await saveSongLibrary();
}

async function addToLibrary(){
  const rowId = 'libnew';
  const titleEl = document.getElementById('song-title-'+rowId);
  const artistEl = document.getElementById('song-artist-'+rowId);
  const keyEl = document.getElementById('song-key-'+rowId);
  const linkEl = document.getElementById('song-link-'+rowId);
  const title = titleEl.value.trim();
  if(!title){ titleEl.focus(); return; }
  const newSong = {
    title,
    artist: (artistEl?.value || '').trim(),
    key: (keyEl?.value || '').trim(),
    link: (linkEl?.value || '').trim()
  };
  const alreadyExists = songLibrary.some(sg=>songsMatch(sg, newSong));
  if(alreadyExists){
    alert('Esa canción ya está guardada en el repertorio.');
    return;
  }
  await addToLibraryIfNew(newSong);
  titleEl.value = '';
  if(artistEl) artistEl.value = '';
  if(keyEl) keyEl.value = '';
  if(linkEl) linkEl.value = '';
  render();
}

async function removeFromLibrary(id){
  songLibrary = songLibrary.filter(s=>s.id!==id);
  await saveSongLibrary();
  render();
}

function pickFromLibrary(rowId, index){
  const song = songLibrary[index];
  if(!song) return;
  const titleEl = document.getElementById('song-title-'+rowId);
  const artistEl = document.getElementById('song-artist-'+rowId);
  const linkEl = document.getElementById('song-link-'+rowId);
  const keyEl = document.getElementById('song-key-'+rowId);
  if(titleEl) titleEl.value = song.title || '';
  if(artistEl) artistEl.value = song.artist || '';
  if(linkEl) linkEl.value = song.link || '';
  if(keyEl) keyEl.value = song.key || '';
  if(!rowId.startsWith('inline-')){
    const s = draftSongs.find(x=>x.id===rowId);
    if(s){ s.title = song.title || ''; s.artist = song.artist || ''; s.link = song.link || ''; s.key = song.key || ''; }
  }
}

function getAccessRole(entry){
  if(!entry) return 'member';
  return typeof entry === 'string' ? entry : (entry.access || 'member');
}

function getMinistryRole(entry){
  if(!entry) return '';
  return typeof entry === 'string' ? '' : (entry.role || '');
}

function getMyRole(name){
  if(!name) return 'member';
  return getAccessRole(rolesMap[name.trim().toLowerCase()]);
}

function roleLabel(r){
  return r==='developer' ? 'Desarrollador' : r==='coordinator' ? 'Coordinador' : 'Miembro';
}

function titleCase(str){
  return str.replace(/\S+/g, t=> t.charAt(0).toUpperCase()+t.slice(1).toLowerCase());
}

async function saveRoles(){
  try{
    await db.collection('shared').doc('user-roles').set({ value: rolesMap });
  }catch(e){
    console.error('No se pudo guardar los accesos:', e);
  }
}

async function submitAccess(){
  const nameEl = document.getElementById('access-name-input');
  const roleEl = document.getElementById('access-role-select');
  const ministryEl = document.getElementById('access-ministry-input');
  const name = nameEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  rolesMap[name.toLowerCase()] = { access: roleEl.value, role: (ministryEl?.value || '').trim() };
  await saveRoles();
  nameEl.value = '';
  if(ministryEl) ministryEl.value = '';
  render();
}

async function removeRoleEntry(index){
  const entries = Object.entries(rolesMap);
  const entry = entries[index];
  if(!entry) return;
  delete rolesMap[entry[0]];
  await saveRoles();
  render();
}

async function saveApiKey(key){
  youtubeApiKey = key || null;
  try{
    await db.collection('shared').doc('youtube-api-key').set({ value: key || '' });
  }catch(e){
    console.error('No se pudo guardar la clave de YouTube:', e);
  }
  showApiKeyModal = false;
  render();
}

function openApiKeyModal(){ showApiKeyModal = true; render(); }
function closeApiKeyModal(){ showApiKeyModal = false; render(); }
function handleApiKeySubmit(){
  const inp = document.getElementById('yt-key-input');
  saveApiKey(inp.value.trim());
}

async function saveServices(){
  try{
    await db.collection('shared').doc('services').set({ value: services });
  }catch(e){
    console.error('No se pudo guardar los servicios:', e);
  }
}

function saveName(name){
  myName = name;
  try{
    localStorage.setItem(NAME_STORAGE_KEY, name);
  }catch(e){
    console.error('No se pudo guardar el nombre en este dispositivo:', e);
  }
  render();
}

function uid(){ return Math.random().toString(36).slice(2,10); }

function fmtDate(d){
  const date = new Date(d + 'T00:00:00');
  const opts = { weekday:'long', day:'numeric', month:'long' };
  const s = date.toLocaleDateString('es-ES', opts);
  return s.charAt(0).toUpperCase() + s.slice(1);
}

function fmtTime(t){
  if(!t) return '';
  const [h, m] = t.split(':').map(Number);
  const period = h>=12 ? 'p. m.' : 'a. m.';
  let h12 = h % 12;
  if(h12===0) h12 = 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}

function fmtDateTime(d, t){
  const base = fmtDate(d);
  return t ? `${base} · ${fmtTime(t)}` : base;
}

function upcomingSorted(list){
  return [...list].sort((a,b)=> a.date.localeCompare(b.date));
}

async function fetchSongResults(rowId, query){
  const dropdown = document.getElementById('song-dropdown-'+rowId);
  if(!youtubeApiKey){
    if(dropdown){
      dropdown.style.display='block';
      dropdown.innerHTML = '<div class="song-loading">Configura una clave de YouTube para buscar. <button class="link-btn" style="padding:0;display:inline;" onclick="openApiKeyModal()">Configurar</button></div>';
    }
    return;
  }
  if(dropdown){ dropdown.style.display='block'; dropdown.innerHTML = '<div class="song-loading">Buscando…</div>'; }
  try{
    const url = 'https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=6&q='+encodeURIComponent(query)+'&key='+encodeURIComponent(youtubeApiKey);
    const res = await fetch(url, { method:'GET', mode:'cors' });
    if(!res.ok){
      let msg = 'No se pudo buscar (HTTP '+res.status+').';
      if(res.status===403) msg = 'La clave de YouTube no es válida o no tiene permisos.';
      lastResults[rowId] = [];
      if(dropdown){ dropdown.style.display='block'; dropdown.innerHTML = '<div class="song-loading">'+msg+'</div>'; }
      return;
    }
    const data = await res.json();
    const items = data.items || [];
    lastResults[rowId] = items.map(it=>({
      trackName: decodeHtml(it.snippet?.title || ''),
      artistName: decodeHtml(it.snippet?.channelTitle || ''),
      artworkUrl60: (it.snippet?.thumbnails?.default?.url) || '',
      videoId: it.id?.videoId || ''
    }));
    if(lastResults[rowId].length === 0){
      if(dropdown){ dropdown.style.display='block'; dropdown.innerHTML = '<div class="song-loading">Sin resultados. Puedes escribir el nombre manualmente.</div>'; }
      return;
    }
  }catch(e){
    console.error('Error buscando en YouTube:', e);
    lastResults[rowId] = [];
    if(dropdown){ dropdown.style.display='block'; dropdown.innerHTML = '<div class="song-loading">No se pudo buscar ahora mismo. Escribe el nombre manualmente.</div>'; }
    return;
  }
  renderDropdown(rowId);
}

function decodeHtml(str){
  const txt = document.createElement('textarea');
  txt.innerHTML = str;
  return txt.value;
}

function renderDropdown(rowId){
  const dropdown = document.getElementById('song-dropdown-'+rowId);
  if(!dropdown) return;
  const results = lastResults[rowId] || [];
  if(results.length === 0){ dropdown.style.display = 'none'; dropdown.innerHTML = ''; return; }
  dropdown.style.display = 'block';
  dropdown.innerHTML = results.map((r,i)=>`
    <div class="song-suggestion" onmousedown="selectSongSuggestion('${rowId}', ${i})">
      ${r.artworkUrl60 ? `<img src="${r.artworkUrl60}" onerror="this.style.display='none'" />` : ''}
      <div class="sinfo">
        <span class="stitle">${escapeHtml(r.trackName || '')}</span>
        <span class="sartist">${escapeHtml(r.artistName || '')}</span>
      </div>
    </div>`).join('');
}

function selectSongSuggestion(rowId, index){
  const track = (lastResults[rowId] || [])[index];
  if(!track) return;
  const titleEl = document.getElementById('song-title-'+rowId);
  const artistEl = document.getElementById('song-artist-'+rowId);
  const linkEl = document.getElementById('song-link-'+rowId);
  const link = track.videoId ? ('https://www.youtube.com/watch?v='+track.videoId) : '';
  if(titleEl) titleEl.value = track.trackName || '';
  if(artistEl) artistEl.value = track.artistName || '';
  if(linkEl) linkEl.value = link;
  if(!rowId.startsWith('inline-')){
    const s = draftSongs.find(x=>x.id===rowId);
    if(s){ s.title = track.trackName || ''; s.artist = track.artistName || ''; s.link = link; }
  }
  lastResults[rowId] = [];
  hideDropdown(rowId);
}

  const songs = draftSongs
    .map(s=>({
      id:s.id,
      title:(document.getElementById('song-title-'+s.id)?.value || '').trim(),
      artist:(document.getElementById('song-artist-'+s.id)?.value || '').trim(),
      link:(document.getElementById('song-link-'+s.id)?.value || '').trim(),
      key:(document.getElementById('song-key-'+s.id)?.value || '').trim()
    }))
    .filter(s=>s.title);

function renderCalendar(list){
  const year = calendarViewDate.getFullYear();
  const month = calendarViewDate.getMonth();
  const firstOfMonth = new Date(year, month, 1);
  const startWeekday = firstOfMonth.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  let monthLabel = firstOfMonth.toLocaleDateString('es-ES', { month:'long', year:'numeric' });
  monthLabel = monthLabel.charAt(0).toUpperCase() + monthLabel.slice(1);

  const servicesByDate = {};
  list.forEach(s=>{
    if(!servicesByDate[s.date]) servicesByDate[s.date] = [];
    servicesByDate[s.date].push(s);
  });

 const todayStr = localTodayISO();

  let cells = '';
  for(let i=0;i<startWeekday;i++){
    cells += `<div class="cal-cell empty"></div>`;
  }
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasService = !!servicesByDate[dateStr];
    const isToday = dateStr === todayStr;
    const isSelected = dateStr === selectedCalendarDay;
    cells += `
      <div class="cal-cell ${hasService?'has-service':''} ${isToday?'today':''} ${isSelected?'selected':''}" onclick="selectCalendarDay('${dateStr}')">
        <span class="cal-daynum">${d}</span>
        ${hasService ? '<span class="cal-dot"></span>' : ''}
      </div>`;
  }

  const weekdayHeaders = ['D','L','M','M','J','V','S'].map(w=>`<div class="cal-weekday">${w}</div>`).join('');

  const calendarCard = `
    <div class="card">
      <div class="cal-header">
        <button class="icon-btn" onclick="prevMonth()" title="Mes anterior">‹</button>
        <span class="section-title" style="margin:0;">${escapeHtml(monthLabel)}</span>
        <button class="icon-btn" onclick="nextMonth()" title="Mes siguiente">›</button>
      </div>
      <div class="cal-grid">${weekdayHeaders}${cells}</div>
    </div>`;

  if(list.length===0){
    return calendarCard + `<div class="empty"><div class="big">Sin fechas todavía</div>Cuando se agreguen servicios, aparecerán aquí.</div>`;
  }

  const relevant = selectedCalendarDay ? (servicesByDate[selectedCalendarDay] || []) : list;
  const detailRows = relevant.map(s=>`
    <div class="role-row">
      <div class="role-info">
        <span class="role-name">${escapeHtml(fmtDateTime(s.date, s.time))}</span>
        <span class="role-person">${escapeHtml(s.label)}</span>
      </div>
    </div>`).join('<div class="divider"></div>') || `<div class="mini-note">Nada para este día.</div>`;

  const detailTitle = selectedCalendarDay
    ? `${escapeHtml(fmtDate(selectedCalendarDay))} <button class="link-btn" style="padding:0;margin-left:8px;" onclick="selectCalendarDay('${selectedCalendarDay}')">Ver todos</button>`
    : 'Todos los próximos servicios';

  return `
    ${calendarCard}
    <div class="section-title">${detailTitle}</div>
    <div class="card">${detailRows}</div>`;
}

function buildICS(svc){

  const [y, m, d] = svc.date.split('-').map(Number);
  let dtStartLine, dtEndLine;

    const [hh, mm] = svc.time.split(':').map(Number);

    const endStr = `${endDate.getFullYear()}${pad2(endDate.getMonth()+1)}${pad2(endDate.getDate())}T${pad2(endDate.getHours())}${pad2(endDate.getMinutes())}00`;
    dtStartLine = `DTSTART:${startStr}`;
    dtEndLine = `DTEND:${endStr}`;
  }else{
    const nextDay = new Date(y, m-1, d+1);
    const nextStr = `${nextDay.getFullYear()}${pad2(nextDay.getMonth()+1)}${pad2(nextDay.getDate())}`;
    dtStartLine = `DTSTART;VALUE=DATE:${y}${pad2(m)}${pad2(d)}`;
    dtEndLine = `DTEND;VALUE=DATE:${nextStr}`;
  }

  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Coordinacion Alabanza//ES',
    'CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${uid}`,
    `DTSTAMP:${dtstamp}`,
    dtStartLine,
    dtEndLine,
    `SUMMARY:${escapeICS(svc.label || 'Servicio')}`,
    'END:VEVENT',
    'END:VCALENDAR'
  ];
  return lines.join('\r\n');
}

function downloadICS(serviceId){
  const svc = services.find(s=>s.id===serviceId);
  if(!svc) return;
  const ics = buildICS(svc);
  const blob = new Blob([ics], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${(svc.label||'servicio').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.ics`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}

function renderMine(list){

    return `<div class="empty"><div class="big">Bandeja vacía</div>No apareces asignado a ningún servicio próximo todavía.</div>`;
  }
  return list.map(s=>{
    const r = s.myRole;
    const songs = s.songs || [];
    const badge = r.status==='confirmed' ? '<span class="badge confirmed">Confirmado</span>'
      : r.status==='declined' ? '<span class="badge declined">No podré ir</span>'
      : '<span class="badge pending">Por confirmar</span>';
    const songsHtml = songs.length ? `
        <div class="divider"></div>
        <div class="mini-note" style="margin-bottom:6px;">Repertorio</div>
        ${songs.map((sg,i)=>`
          <div class="song-row" style="padding:4px 0;">
            <span class="song-num">${i+1}.</span>
            <span class="song-title">${escapeHtml(sg.title)}${sg.artist ? ` <span class="song-artist">— ${escapeHtml(sg.artist)}</span>` : ''}</span>
            ${sg.key ? `<span class="song-key">${escapeHtml(sg.key)}</span>` : ''}
            ${renderSongLink(sg.link)}

      <div class="card">
        <div class="date-row">
          <span class="date">${escapeHtml(fmtDateTime(s.date, s.time))}</span>
          ${badge}
        </div>
        <div class="label">${escapeHtml(s.label)}</div>
        <div class="role-row" style="padding-top:0;">
          <div class="role-info">
            <span class="role-name">Tu rol: ${escapeHtml(r.role)}</span>
          </div>
        </div>
        <div class="confirm-actions" style="margin-top:10px;">
          <button class="btn-small yes" onclick="respond('${s.id}','${r.id}','confirmed')">Confirmar</button>
          <button class="btn-small no" onclick="respond('${s.id}','${r.id}','declined')">No podré ir</button>

  const cards = list.map(s=>{

    const rolesHtml = s.roles.map(r=>{
      const badge = r.status==='confirmed' ? '<span class="badge confirmed">Confirmado</span>'
        : r.status==='declined' ? '<span class="badge declined">No podrá ir</span>'
        : '<span class="badge pending">Por confirmar</span>';
      return `
        <div class="role-row">
          <div class="role-info">
            <span class="role-name">${escapeHtml(r.role)}</span>
            <span class="role-person">${escapeHtml(r.person)}</span>
          </div>
          ${badge}
        </div>`;
    }).join('<div class="divider"></div>');

    const songs = s.songs || [];
    const songsListHtml = songs.map((sg,i)=>`
      <div class="song-row">
        <span class="song-num">${i+1}.</span>
        <span class="song-title">${escapeHtml(sg.title)}${sg.artist ? ` <span class="song-artist">— ${escapeHtml(sg.artist)}</span>` : ''}</span>
        ${sg.key ? `<span class="song-key">${escapeHtml(sg.key)}</span>` : ''}

      ${songLibrary.length ? `<select onchange="pickFromLibrary('inline-${s.id}', this.value)" style="margin-bottom:8px;">
        <option value="">O elige del repertorio guardado...</option>
        ${songLibrary.map((sg,i)=>`<option value="${i}">${escapeHtml(sg.title)}${sg.artist ? ' — '+escapeHtml(sg.artist) : ''}</option>`).join('')}
      </select>` : ''}

        <div class="song-search-wrap">
          <input id="song-title-inline-${s.id}" placeholder="Buscar canción..." oninput="handleSongInput('inline-${s.id}', this.value)" onblur="setTimeout(()=>hideDropdown('inline-${s.id}'),150)" />
          <input type="hidden" id="song-artist-inline-${s.id}" />
          <input type="hidden" id="song-link-inline-${s.id}" />
          <div class="song-dropdown" id="song-dropdown-inline-${s.id}" style="display:none;"></div>
        </div>
        <input id="song-key-inline-${s.id}" class="song-key-input" placeholder="Tono" />
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn-small yes" onclick="addSongToService('${s.id}')">Agregar</button>
        <button class="btn-small" onclick="toggleSongForm('${s.id}')">Cancelar</button>
      </div>` : `<button class="link-btn" onclick="toggleSongForm('${s.id}')">+ Agregar canción</button>`;

    return `
      <div class="card">
        <div class="card-header-row">
          <span class="date">${escapeHtml(fmtDateTime(s.date, s.time))}</span>
          <span style="display:flex;gap:10px;">
            <button class="icon-btn" onclick="startEditService('${s.id}')" title="Editar servicio" style="color:var(--accent);">✎</button>
            <button class="icon-btn" onclick="deleteService('${s.id}')" title="Eliminar servicio">✕</button>
          </span>
        </div>
        <div class="label">${escapeHtml(s.label)}</div>
        <button class="link-btn" style="margin-bottom:4px;" onclick="downloadICS('${s.id}')">📅 Agregar al calendario</button>
        ${rolesHtml}
        <div class="divider"></div>
        <div class="mini-note" style="margin-bottom:2px;">Repertorio</div>
        ${songsListHtml}
        ${songFormHtml}
      </div>`;
  }).join('');
  return summaryHtml + formHtml + cards;
}

function renderPendingSummary(list){
  const todayStr = new Date().toISOString().slice(0,10);
  const upcoming = list.filter(s=>s.date >= todayStr);
  const withPending = upcoming
    .map(s=>({ ...s, pendingRoles: s.roles.filter(r=>r.status==='pending') }))
    .filter(s=>s.pendingRoles.length>0);

  if(upcoming.length===0) return '';

  if(withPending.length===0){
    return `<div class="card"><div class="mini-note" style="margin-top:0;">Todos han confirmado en los próximos servicios. 🎉</div></div>`;
  }
  const rows = withPending.map(s=>`
    <div class="role-row">
      <div class="role-info">
        <span class="role-name">${escapeHtml(fmtDateTime(s.date, s.time))} — ${escapeHtml(s.label)}</span>
        <span class="role-person">Falta: ${s.pendingRoles.map(r=>escapeHtml(r.person)).join(', ')}</span>
      </div>
      <span class="badge pending">${s.pendingRoles.length} de ${s.roles.length}</span>
    </div>`).join('<div class="divider"></div>');
  return `
    <div class="card">
      <div class="section-title" style="margin-top:0;">Pendientes por confirmar</div>
      ${rows}
    </div>`;
}

function startEditService(serviceId){
  const svc = services.find(s=>s.id===serviceId);
  if(!svc) return;
  editingServiceId = serviceId;
  editDraftDate = svc.date;
  editDraftTime = svc.time || '';
  editDraftLabel = svc.label;
  editDraftRoles = svc.roles.map(r=>({ id:r.id, role:r.role, person:r.person }));
  render();
}

function cancelEditService(){
  editingServiceId = null;
  render();
}

function addEditRole(){
  editDraftRoles.push({ id:uid(), role:'', person:'' });
  render();
}

function removeEditRole(id){
  editDraftRoles = editDraftRoles.filter(r=>r.id!==id);
  render();
}

function updateEditRoleField(id, field, value){
  const r = editDraftRoles.find(x=>x.id===id);
  if(!r) return;
  r[field] = value;
  if(field==='person' && value && !r.role){
    const ministryRole = getMinistryRole(rolesMap[value.trim().toLowerCase()]);
    if(ministryRole){
      r.role = ministryRole;
      const roleInput = document.getElementById('edit-role-role-'+id);
      if(roleInput) roleInput.value = ministryRole;
    }
  }
}

function renderEditForm(svc){
  const memberOptions = Object.keys(rolesMap).map(lname=>titleCase(lname)).sort();
  const rolesHtml = editDraftRoles.map(r=>`
    <div class="role-form-row">
      <input id="edit-role-role-${r.id}" placeholder="Rol (ej. Guitarrista)" value="${escapeHtml(r.role)}" onchange="updateEditRoleField('${r.id}','role',this.value)" />
      <select id="edit-role-person-${r.id}" onchange="updateEditRoleField('${r.id}','person',this.value)">
        <option value="">Selecciona un miembro</option>
        ${memberOptions.map(name=>`<option value="${escapeHtml(name)}" ${r.person===name?'selected':''}>${escapeHtml(name)}</option>`).join('')}
      </select>
      <button class="remove-role" onclick="removeEditRole('${r.id}')">✕</button>
    </div>`).join('');
  return `
    <div class="card">
      <label class="field-label">Fecha del servicio</label>
      <input type="date" id="edit-date" value="${escapeHtml(editDraftDate)}" onchange="editDraftDate=this.value" />
      <label class="field-label">Hora (opcional)</label>
      <input type="time" id="edit-time" value="${escapeHtml(editDraftTime)}" onchange="editDraftTime=this.value" />
      <label class="field-label">Nombre del servicio</label>
      <input id="edit-label" value="${escapeHtml(editDraftLabel)}" onchange="editDraftLabel=this.value" />
      <label class="field-label">Roles y responsables</label>
      <div>${rolesHtml}</div>
      <button class="btn-ghost" onclick="addEditRole()">+ Agregar rol</button>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn-main" onclick="submitEditService('${svc.id}')">Guardar cambios</button>
        <button class="btn-small" onclick="cancelEditService()" style="flex:0 0 auto;">Cancelar</button>
      </div>
    </div>`;
}

async function submitEditService(serviceId){
  const svc = services.find(s=>s.id===serviceId);
  if(!svc) return;
  if(!editDraftDate || !editDraftLabel.trim()){ alert('Falta la fecha o el nombre del servicio.'); return; }
  const newRoles = editDraftRoles
    .map(r=>{
      const roleVal = (document.getElementById('edit-role-role-'+r.id)?.value || r.role || '').trim();
      const personVal = (document.getElementById('edit-role-person-'+r.id)?.value || r.person || '').trim();
      const existing = svc.roles.find(orig=>orig.id===r.id);
      const samePerson = existing && existing.person.trim().toLowerCase()===personVal.toLowerCase();
      return { id:r.id, role:roleVal, person:personVal, status: samePerson ? existing.status : 'pending' };
    })
    .filter(r=>r.role && r.person);
  if(newRoles.length===0){ alert('Agrega al menos un rol con su responsable.'); return; }
  svc.date = editDraftDate;
  svc.time = editDraftTime;
  svc.label = editDraftLabel.trim();
  svc.roles = newRoles;
  await saveServices();
  editingServiceId = null;
  render();
}

        <input type="hidden" id="song-artist-${s.id}" value="${escapeHtml(s.artist||'')}" />
        <input type="hidden" id="song-link-${s.id}" value="${escapeHtml(s.link||'')}" />
        <div class="song-dropdown" id="song-dropdown-${s.id}" style="display:none;"></div>
      </div>
      <input id="song-key-${s.id}" placeholder="Tono" value="${escapeHtml(s.key)}" style="max-width:90px;" />
      <button class="remove-role" onclick="removeDraftSong('${s.id}')">✕</button>

      <label class="field-label">Hora (opcional)</label>
      <input type="time" id="new-time" value="${escapeHtml(draftTime)}" onchange="draftTime=this.value" />
      <label class="field-label">Nombre del servicio</label>
      <input id="new-label" placeholder="Ej. Culto general, Servicio de jóvenes..." value="${escapeHtml(draftLabel)}" onchange="draftLabel=this.value" />
      <label class="field-label">Roles y responsables</label>
      <div id="roles-container">${rolesHtml}</div>
      <button class="btn-ghost" onclick="addDraftRole()">+ Agregar rol</button>

      <label class="field-label" style="margin-top:18px;">Repertorio (opcional)</label>
      <div id="songs-container">${songsHtml}</div>
      <button class="btn-ghost" onclick="addDraftSong()">+ Agregar canción</button>

      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="btn-main" onclick="submitNewService()">Guardar servicio</button>
        <button class="btn-small" onclick="cancelAddForm()" style="flex:0 0 auto;">Cancelar</button>
      </div>
    </div>`;
}

function setTab(t){ activeTab = t; render(); }

  const inp = document.getElementById('name-input');
  const val = inp.value.trim();
  if(!val){ inp.focus(); return; }
  saveName(val);
}

function changeName(){
  myName = null;
  render();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

loadAll();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('No se pudo registrar el service worker:', e));
  });
}
